<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notities</title>
<meta name="description" content="Je notities, op je telefoon en je laptop.">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F4F1E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notities">
<link rel="preload" href="/fonts/source-sans-3.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>

<!-- Inloggen en registreren -->
<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-mast"><img src="/icons/icon-192.png" alt="" width="44" height="44"><span>Notities</span></div>
    <div class="auth-rule"></div>

    <form id="loginForm" class="auth-form" novalidate>
      <h1>Inloggen</h1>
      <div class="error" id="loginError" role="alert" hidden></div>
      <label class="field-label" for="loginName">Gebruikersnaam of e-mail</label>
      <input class="field" id="loginName" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="field-label" for="loginPw">Wachtwoord</label>
      <input class="field" id="loginPw" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary big" type="submit">Inloggen</button>
      <p class="auth-foot">Nog geen account? <a href="#registreren" id="toRegister">Account aanmaken</a></p>
    </form>

    <form id="registerForm" class="auth-form" novalidate hidden>
      <h1>Account aanmaken</h1>
      <div class="error" id="registerError" role="alert" hidden></div>
      <label class="field-label" for="regUser">Gebruikersnaam</label>
      <input class="field" id="regUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="bijv. tim" required>
      <label class="field-label" for="regName">Volledige naam</label>
      <input class="field" id="regName" name="full_name" autocomplete="name" maxlength="100" required>
      <label class="field-label" for="regEmail">E-mailadres</label>
      <input class="field" id="regEmail" name="email" type="email" autocomplete="email" maxlength="200" required>
      <label class="field-label" for="regPw">Wachtwoord</label>
      <input class="field" id="regPw" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <span class="hint">Minimaal 10 tekens</span>
      <button class="btn primary big" type="submit">Account aanmaken</button>
      <p class="auth-foot">Heb je al een account? <a href="#inloggen" id="toLogin">Inloggen</a></p>
    </form>

    <div id="pendingCard" class="auth-form" hidden>
      <h1>Account aangemaakt</h1>
      <p class="muted">Je account wacht op goedkeuring van de beheerder. Daarna kun je inloggen.</p>
      <button class="btn big" type="button" id="pendingBack">Naar inloggen</button>
    </div>
  </div>
</div>

<!-- De app zelf -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <header class="mast">
      <h1 class="mast-title" id="viewTitle">Notities</h1>
      <div class="row">
        <span class="sync-dot" id="syncDot" role="status"></span>
        <button class="icon-btn" id="viewBtn" type="button" aria-label="Weergave en sorteren" data-icon="sort"></button>
      </div>
    </header>
    <div class="mast-rule"></div>
    <div class="search-wrap">
      <span data-icon="search"></span>
      <input class="search" id="search" type="search" placeholder="Zoeken in je notities" autocomplete="off" aria-label="Zoeken in notities">
    </div>
    <div class="chips" id="chips"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="list" id="list"></div>

    <nav class="nav" id="nav" aria-label="Navigatie">
      <div class="nav-pill" id="navPill">
        <span class="nav-ind" id="navInd" aria-hidden="true"></span>
        <button type="button" data-nav="notities"><span data-icon="note"></span><span>Notities</span></button>
        <button type="button" data-nav="lijsten"><span data-icon="list"></span><span>Lijsten</span></button>
        <button type="button" data-nav="herinneringen"><span data-icon="bell"></span><span>Gepland</span></button>
        <button type="button" data-nav="meer"><span data-icon="more"></span><span>Meer</span></button>
      </div>
      <button type="button" class="nav-add" id="navAdd" aria-label="Nieuwe notitie" title="Nieuwe notitie (Ctrl+Alt+N)"><span data-icon="plus"></span></button>
    </nav>
  </aside>

  <main class="pane" id="pane">
    <div class="empty" id="emptyPane">
      <img src="/icons/icon-192.png" alt="" width="72" height="72">
      <p>Kies een notitie, of begin een nieuwe.</p>
      <div class="row">
        <button class="btn primary" id="emptyNew" type="button">Nieuwe notitie</button>
        <button class="btn" id="emptyList" type="button">Nieuwe lijst</button>
      </div>
    </div>

    <article class="editor" id="editor" hidden>
      <header class="ed-top">
        <button class="icon-btn back" id="backBtn" type="button" aria-label="Terug" data-icon="back"></button>
        <span class="ed-meta" id="edMeta"></span>
        <div class="row">
          <button class="remind-chip" id="remindBtn" type="button" aria-label="Herinnering"><span data-icon="bell"></span><span id="remindText"></span></button>
          <button class="icon-btn" id="pinBtn" type="button" aria-label="Vastpinnen" aria-pressed="false" data-icon="pin"></button>
          <button class="icon-btn" id="noteMenuBtn" type="button" aria-label="Opties" data-icon="more"></button>
        </div>
      </header>
      <div class="note-banner" id="noteBanner" hidden>
        <span id="noteBannerText"></span>
        <div class="row" id="noteBannerActions"></div>
      </div>
      <div class="ed-scroll" id="edScroll">
        <div class="ed-inner">
          <input class="ed-title" id="edTitle" placeholder="Titel" maxlength="300" autocomplete="off" aria-label="Titel">
          <div class="ed-tags" id="edTags"></div>
          <div class="fmt" id="fmtBar" role="toolbar" aria-label="Opmaak">
            <button type="button" data-fmt="bold" aria-label="Vet (Ctrl+B)" title="Vet (Ctrl+B)" data-icon="bold"></button>
            <button type="button" data-fmt="italic" aria-label="Schuin (Ctrl+I)" title="Schuin (Ctrl+I)" data-icon="italic"></button>
            <button type="button" data-fmt="heading" aria-label="Kop" title="Kop" data-icon="heading"></button>
            <button type="button" data-fmt="bullet" aria-label="Opsomming" title="Opsomming" data-icon="bullet"></button>
            <button type="button" data-fmt="checkbox" aria-label="Afvinkvakje" title="Afvinkvakje" data-icon="checkbox"></button>
            <button type="button" data-fmt="quote" aria-label="Citaat" title="Citaat" data-icon="quote"></button>
            <button type="button" data-fmt="link" aria-label="Link" title="Link" data-icon="link"></button>
            <span class="fmt-gap"></span>
            <button type="button" class="fmt-mode" id="previewBtn" aria-pressed="false"><span data-icon="eye"></span><span>Lezen</span></button>
          </div>
          <textarea class="ed-body" id="edBody" placeholder="Begin met typen…" aria-label="Notitie"></textarea>
          <div class="md" id="preview" hidden></div>
          <div class="checklist" id="checklist" hidden>
            <div id="openItems"></div>
            <button class="add-item" id="addItem" type="button"><span data-icon="plus"></span>Item toevoegen</button>
            <details class="done-items" id="doneWrap" open>
              <summary id="doneSummary"></summary>
              <div id="doneItems"></div>
            </details>
          </div>
        </div>
      </div>
    </article>
  </main>
</div>

<!-- Eén paneel voor instellingen, labels, versies, herinneringen -->
<div class="sheet-back" id="sheetBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet-top">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Sluiten" data-icon="close"></button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<template id="settingsTpl">
  <section class="group">
    <h3>Weergave</h3>
    <div class="seg" id="themeSeg" role="radiogroup" aria-label="Thema">
      <button type="button" data-v="systeem" role="radio">Systeem</button>
      <button type="button" data-v="licht" role="radio">Licht</button>
      <button type="button" data-v="donker" role="radio">Donker</button>
    </div>
  </section>
  <section class="group stats" id="stats"></section>
  <form class="group" id="meForm" novalidate>
    <h3>Account</h3>
    <p class="muted small" id="meUser"></p>
    <label class="field-label" for="meName">Naam</label>
    <input class="field" id="meName" maxlength="100" autocomplete="name">
    <label class="field-label" for="meEmail">E-mailadres</label>
    <input class="field" id="meEmail" type="email" maxlength="200" autocomplete="email">
    <div class="error" id="meError" role="alert" hidden></div>
    <button class="btn" type="submit">Opslaan</button>
  </form>
  <form class="group" id="pwForm" novalidate>
    <h3>Wachtwoord wijzigen</h3>
    <label class="field-label" for="pwCur">Huidig wachtwoord</label>
    <input class="field" id="pwCur" type="password" autocomplete="current-password">
    <label class="field-label" for="pwNew">Nieuw wachtwoord</label>
    <input class="field" id="pwNew" type="password" autocomplete="new-password" minlength="10">
    <div class="error" id="pwError" role="alert" hidden></div>
    <button class="btn" type="submit">Wachtwoord wijzigen</button>
  </form>
  <section class="group" id="adminGroup" hidden>
    <h3>Gebruikers</h3>
    <div id="adminList" class="users"></div>
  </section>
  <section class="group" id="appGroup" hidden>
    <h3>App</h3>
    <p class="muted small" id="appVersion"></p>
    <button class="btn" id="updateBtn" type="button">Nu zoeken naar updates</button>
  </section>
  <section class="group">
    <button class="btn danger" id="logoutBtn" type="button">Uitloggen</button>
  </section>
</template>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
